:root{--bg:#f6f1e7;--ink:#2b2a33;--mut:#8b8678;--card:#fffdf8;--ln:#ddd5c0;--acc:#3e6bff;--hi:#ffd75e;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#1f1e24;--ink:#f1ede3;--mut:#9a968b;--card:#2a2930;--ln:#3b3a43;--hi:#b8952a}}
:root[data-theme=dark]{--bg:#1f1e24;--ink:#f1ede3;--mut:#9a968b;--card:#2a2930;--ln:#3b3a43;--hi:#b8952a}
html{scroll-padding-top:env(safe-area-inset-top,0px)}html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.35 Roboto,system-ui,-apple-system,sans-serif;-webkit-user-select:none;user-select:none;overscroll-behavior:none;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
button{font:inherit;color:inherit;background:var(--card);border:1.5px solid var(--ink);border-radius:12px 4px 12px 4px/4px 12px 4px 12px;min-height:42px;min-width:42px;padding:0 12px;display:inline-flex;align-items:center;justify-content:center;gap:6px;cursor:pointer;flex:none}
button:active{transform:scale(.96)}button.on{background:var(--hi);color:#2b2a33}button:disabled{opacity:.3}button.g{border-color:transparent;background:none}
#hm{max-width:520px;margin:0 auto;padding:28px 18px;height:100%;overflow:auto;box-sizing:border-box}
h1{font:italic 700 34px Georgia,serif;margin:8px 0 2px}h1 span{background:linear-gradient(transparent 62%,var(--hi) 62%)}.sub{color:var(--mut);margin:0 0 20px}
.big{width:100%;min-height:62px;font-size:18px;font-weight:600;background:var(--hi);color:#2b2a33;margin-bottom:26px}
h2{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--mut)}
.pj{border:1.5px dashed var(--mut);border-radius:14px;padding:12px;margin-bottom:10px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}.pj .nm{flex:1 1 100%;font-weight:600}.pj small{display:block;color:var(--mut);font-weight:400}.pj button{min-height:38px;font-size:13px;flex:1}
#ed{display:flex;flex-direction:column;height:100%}
header{display:flex;align-items:center;gap:2px;padding:4px 6px;height:52px;box-sizing:border-box;flex:none}header .t{flex:1;min-width:0;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#cv{flex:1;min-height:0;width:100%;display:block;touch-action:none;background-image:radial-gradient(var(--ln) 1.2px,transparent 1.4px);background-size:22px 22px}
#pg{display:flex;gap:6px;padding:6px 8px;align-items:center;overflow-x:auto;flex:none}#pg button{min-height:36px;min-width:36px}
footer{background:var(--card);border-top:1.5px solid var(--ink);padding:8px 8px 10px;flex:none}
.row{display:flex;gap:8px;overflow-x:auto;padding:2px 0 8px;align-items:center}.tools{display:flex;gap:8px}.tools button{flex:1;min-height:54px;flex-direction:column;gap:2px;font-size:13px}
.tabs{display:flex;gap:6px;align-items:center;margin-bottom:6px}.tb{flex:1;display:flex;gap:6px;overflow-x:auto}.tb button{min-height:38px}
.st{display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0}.st label{font-size:12px;color:var(--mut)}.sp{display:flex;gap:6px;align-items:center}
.sp button{min-width:44px;min-height:44px;padding:0;font-size:22px;line-height:1}.sp input{width:72px;height:44px;text-align:center;font-size:16px;-moz-appearance:textfield}.sp input::-webkit-inner-spin-button,.sp input::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px 8px;justify-items:center;padding-bottom:4px}.grid .st:last-child:nth-child(odd){grid-column:1/-1}.grid .st:only-child .sp button{min-width:54px;min-height:54px}.grid .st:only-child .sp input{width:112px;height:54px;font-size:18px}.grid .st:only-child label{font-size:14px}
.chips{display:flex;gap:6px;align-items:center;justify-content:space-between;padding:2px 2px 12px}.chips .c{flex:1 1 0;min-width:0;min-height:0;max-width:54px;width:auto;height:auto;aspect-ratio:1/1}.chips .rb{display:block}#pop .chips{width:260px}
.st input,#md input[type=text],textarea{font:inherit;color:inherit;background:var(--bg);border:1.5px solid var(--ln);border-radius:8px}
textarea{width:100%;box-sizing:border-box;padding:8px;margin-bottom:8px;font-size:16px}#md input[type=text]{height:44px;padding:0 10px;font-size:16px}
.sw{display:flex;gap:6px;flex:none}.c{width:34px;height:34px;min-width:34px;min-height:34px;border-radius:50%;padding:0}.c.n{background:linear-gradient(135deg,transparent 46%,#e5484d 46% 54%,transparent 54%),#fff}.rb{background:conic-gradient(red,yellow,lime,aqua,blue,magenta,red);position:relative;overflow:hidden;border:1.5px solid var(--ink);display:inline-block;cursor:pointer}.rb input{opacity:0;position:absolute;inset:0;width:100%;height:100%}
#pop{position:fixed;z-index:20;background:var(--card);border:1.5px solid var(--ink);border-radius:12px;padding:6px;display:flex;flex-direction:column;gap:2px;min-width:180px}#pop button{justify-content:flex-start;border:0;background:none}#pop .sw{padding:6px;flex-wrap:wrap}
#md{position:fixed;inset:0;background:#0006;display:flex;align-items:center;justify-content:center;z-index:30;padding:20px}.cd{background:var(--card);border:1.5px solid var(--ink);border-radius:16px;padding:18px;width:100%;max-width:340px;display:flex;flex-direction:column;gap:12px}.cd label{display:flex;gap:8px;align-items:center;min-height:36px}
#to{position:fixed;left:50%;bottom:120px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:20px;z-index:40;pointer-events:none}
.lb{fill:var(--mut);font:12px system-ui}.sh{fill:var(--ink);opacity:.12}.so,.sb,.hd,.gd,.lb,.sh{pointer-events:none}.so{fill:none;stroke:var(--acc);opacity:.55}.sb{fill:none;stroke:var(--acc);stroke-dasharray:6 4}.hd{fill:#fff;stroke:var(--acc)}.gd{stroke:#e5484d;fill:none}
